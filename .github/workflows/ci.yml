name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev qt6-5compat-dev \
            qt6-tools-dev-tools libgl1-mesa-dev

      - name: Build
        run: ./build.sh

      - name: Test
        run: ./test.sh

      - name: Smoke test (headless)
        run: ./build/lucidlight run --version
